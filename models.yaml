# The model roster. Prices are USD per million tokens, from each provider's list price
# (verified against the providers' pricing pages on the date in `priced`).
# A run names a model and one of its settings: "gpt-5.6-luna@low".

models:
  # Cheap tier: pilots and the reasoning sweep.
  gemini-3.5-flash-lite:
    label: Gemini 3.5 Flash-Lite
    provider: gemini
    retry_max_output_tokens: 65536  # retry an attempt cut off at the cap with this one
    model_id: gemini-3.5-flash-lite
    priced: 2026-10-16
    pricing: {input: 0.30, output: 2.50, cached_input: 0.03, cache_storage_per_hour: 1.00}
    settings:
      minimal: {thinking_level: minimal}
      low: {thinking_level: low}
      medium: {thinking_level: medium}
      high: {thinking_level: high}
  gemini-3.7-flash:
    label: Gemini 3.8 Flash
    # Google retired this id on 2026-10-12: requests to it are served by gemini-3.8-flash
    # (checked: response.model_version). Results are reported under the served model.
    provider: gemini
    retry_max_output_tokens: 65536  # retry an attempt cut off at the cap with this one
    model_id: gemini-3.7-flash
    priced: 2026-10-16  # introductory rate; doubles on 2027-01-01
    pricing: {input: 0.75, output: 3.75, cached_input: 0.075, cache_storage_per_hour: 0.50}
    settings:
      none: {thinking_budget: 0}  # still thinks a little; minimal is rejected
      low: {thinking_level: low}
      medium: {thinking_level: medium}
      high: {thinking_level: high}
  gpt-5.6-luna:
    label: GPT-5.6 Luna
    provider: openai
    retry_max_output_tokens: 64000  # retry an attempt cut off at the cap with this one
    model_id: gpt-5.6-luna
    priced: 2026-10-16
    pricing: {input: 0.20, output: 1.20, cached_input: 0.02}
    settings:
      none: {effort: none}
      low: {effort: low}
      medium: {effort: medium}
      high: {effort: high}
  gpt-6-luna:
    label: GPT-6 Luna
    provider: openai
    retry_max_output_tokens: 64000  # retry an attempt cut off at the cap with this one
    model_id: gpt-6-luna
    priced: 2026-10-16
    pricing: {input: 0.10, output: 0.50, cached_input: 0.01}
    settings:
      none: {effort: none}
      low: {effort: low}
      medium: {effort: medium}
      high: {effort: high}
      xhigh: {effort: xhigh}
  deepseek-v4-flash:
    label: DeepSeek V4 Flash
    provider: openrouter
    retry_max_output_tokens: 64000  # retry an attempt cut off at the cap with this one
    model_id: deepseek/deepseek-v4-flash
    priced: 2026-10-16  # OpenRouter reports each call's cost; pinned to Cloudflare (the account allows a fixed set of hosts)
    pricing: {input: 0.09, output: 0.18, cached_input: 0.018}
    settings:
      default: {provider_order: [cloudflare]}
  claude-haiku-5-5:
    label: Claude Haiku 5.5
    provider: anthropic
    retry_max_output_tokens: 64000  # retry an attempt cut off at the cap with this one
    model_id: claude-haiku-5-5
    priced: 2026-10-16
    pricing: {input: 0.10, output: 0.50, cached_input: 0.01, cache_write: 0.125}
    settings:
      nothink: {effort: low, thinking: disabled}
      low: {effort: low}
      medium: {effort: medium}
      high: {effort: high}

  # Frontier tier: only once the tasks are final.
  claude-opus-5-5:
    label: Claude Opus 5.5
    provider: anthropic
    retry_max_output_tokens: 64000  # retry an attempt cut off at the cap with this one
    model_id: claude-opus-5-5
    priced: 2026-10-16
    pricing: {input: 4.00, output: 20.00, cached_input: 0.20, cache_write: 5.00}
    settings:
      low: {effort: low}
      medium: {effort: medium}
      high: {effort: high, max_output_tokens: 32000}
      xhigh: {effort: xhigh, max_output_tokens: 32000}
  claude-fable-5-1:
    label: Claude Fable 5.1
    provider: anthropic
    retry_max_output_tokens: 64000  # retry an attempt cut off at the cap with this one
    model_id: claude-fable-5-1
    priced: 2026-10-16
    pricing: {input: 10.00, output: 50.00, cached_input: 0.25, cache_write: 12.50}
    settings:
      low: {effort: low}
      medium: {effort: medium}
      high: {effort: high, max_output_tokens: 32000}
  gpt-6.1-sol:
    label: GPT-6.1 Sol
    provider: openai
    retry_max_output_tokens: 64000  # retry an attempt cut off at the cap with this one
    model_id: gpt-6.1-sol
    priced: 2026-10-16
    pricing: {input: 2.00, output: 10.00, cached_input: 0.10}
    settings:
      # The API rejects effort none for this model.
      low: {effort: low}
      medium: {effort: medium}
      high: {effort: high, max_output_tokens: 32000}
      xhigh: {effort: xhigh, max_output_tokens: 32000}
      low-flex: {effort: low, service_tier: flex, price_multiplier: 0.5}
      medium-flex: {effort: medium, service_tier: flex, price_multiplier: 0.5}
      high-flex: {effort: high, service_tier: flex, price_multiplier: 0.5, max_output_tokens: 32000}
      xhigh-flex: {effort: xhigh, service_tier: flex, price_multiplier: 0.5, max_output_tokens: 32000}
  gemini-3.8-flash:
    label: Gemini 3.8 Flash
    provider: gemini
    retry_max_output_tokens: 65536  # retry an attempt cut off at the cap with this one
    model_id: gemini-3.8-flash
    priced: 2026-10-16
    pricing: {input: 0.75, output: 3.75, cached_input: 0.075, cache_storage_per_hour: 0.50}
    settings:
      minimal: {thinking_level: minimal}
      low: {thinking_level: low}
      high: {thinking_level: high}
  gemini-4-argon:
    label: Gemini 4 Argon
    provider: gemini
    retry_max_output_tokens: 65536  # retry an attempt cut off at the cap with this one
    model_id: gemini-4-argon
    priced: 2026-10-16  # introductory rate through 2026-11-30, then 4.00 / 20.00; implicit caching only
    pricing: {input: 2.00, output: 10.00, cached_input: 0.10}
    settings:
      # Thinking levels low, medium and high; the API rejects minimal.
      default: {}
      low: {thinking_level: low}
      medium: {thinking_level: medium}
      high: {thinking_level: high}
      low-flex: {thinking_level: low, service_tier: flex, price_multiplier: 0.5}
      medium-flex: {thinking_level: medium, service_tier: flex, price_multiplier: 0.5}
      high-flex: {thinking_level: high, service_tier: flex, price_multiplier: 0.5}
  gemini-3.1-pro:
    label: Gemini 3.1 Pro
    provider: gemini
    retry_max_output_tokens: 65536  # retry an attempt cut off at the cap with this one
    model_id: gemini-3.1-pro-preview
    priced: 2026-10-16
    pricing: {input: 2.00, output: 12.00, cached_input: 0.20, cache_storage_per_hour: 4.50}
    settings:
      low: {thinking_level: low}
      high: {thinking_level: high, max_output_tokens: 32000}
  glm-5.3:
    label: GLM 5.3
    provider: openrouter
    retry_max_output_tokens: 64000  # retry an attempt cut off at the cap with this one
    model_id: z-ai/glm-5.3
    priced: 2026-10-16  # OpenRouter reports each call's cost; pinned to Fireworks (the account allows a fixed set of hosts)
